<title>Kelime Köprüsü İnceleme</title>
<style>
  /* Tek sütun, telefon önce: üstte ilerleme, ortada tek kelime kartı, altta büyük karar düğmeleri.
     Renkler oyunun kendi tokenları (kâğıt zemin, bordo ipucu mürekkebi). */
  :root {
    --bg: #fff6e9;
    --surface: #ffffff;
    --line: #efd9bb;
    --text: #2b1d14;
    --muted: #6b5443;
    --clue-bg: #fbdde2;
    --clue-ink: #5b1a28;
    --arrow: #c0263a;
    --good: #16703a;
    --good-bg: #e2f5e6;
    --bad: #b42318;
    --bad-bg: #fde8e5;
    --warn-bg: #fff3c4;
    --warn-ink: #7a4b00;
    --mark: #ffd27a;
    --focus: #1d4ed8;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Noto Serif', serif;
    --sans: ui-rounded, 'SF Pro Rounded', 'Nunito', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1d1a24; --surface: #2a2533; --line: #443c52; --text: #f5ece2; --muted: #c2b3a3;
      --clue-bg: #4a2a36; --clue-ink: #ffd9e0; --arrow: #ff8fa6;
      --good: #6fd08c; --good-bg: #1f3a28; --bad: #ff8a80; --bad-bg: #45211f;
      --warn-bg: #45391a; --warn-ink: #ffd98a; --mark: #7a5a1c; --focus: #93b4ff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1d1a24; --surface: #2a2533; --line: #443c52; --text: #f5ece2; --muted: #c2b3a3;
    --clue-bg: #4a2a36; --clue-ink: #ffd9e0; --arrow: #ff8fa6;
    --good: #6fd08c; --good-bg: #1f3a28; --bad: #ff8a80; --bad-bg: #45211f;
    --warn-bg: #45391a; --warn-ink: #ffd98a; --mark: #7a5a1c; --focus: #93b4ff;
  }
  html, body { background: var(--bg); color: var(--text); }
  body { font-family: var(--sans); font-size: 16px; line-height: 1.45; }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 32px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-family: var(--serif); font-size: 1.35rem; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
  .progress { display: flex; flex-direction: column; gap: 6px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .bar .ok { background: var(--good); } .bar .ed { background: var(--arrow); } .bar .dr { background: var(--muted); }
  .counts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .counts b { color: var(--text); }
  .tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--line); }
  .tabs button { flex: 1; background: none; border: 0; padding: 10px 4px; font: inherit; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--clue-ink); border-color: var(--arrow); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .banner { padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); font-size: .92rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .head { background: var(--clue-bg); color: var(--clue-ink); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .pair { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; font-family: var(--serif); }
  .pair .en { font-size: 1.9rem; font-weight: 700; }
  .pair .arrow { color: var(--arrow); font-size: 1.3rem; }
  .pair .tr { font-size: 1.9rem; font-weight: 700; }
  .alts { font-size: .92rem; }
  .pair .ctx { font-family: var(--sans); font-size: 1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--surface); color: var(--clue-ink); border-radius: 99px; padding: 2px 9px; }
  .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .label { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .row p { margin: 0; overflow-wrap: anywhere; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  .flags { margin: 0; padding: 10px 12px 10px 28px; background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; font-size: .9rem; }
  .cross { font-size: .9rem; padding: 8px 12px; border-radius: 10px; }
  .cross.same { background: var(--good-bg); color: var(--good); }
  .cross.diff { background: var(--warn-bg); color: var(--warn-ink); }
  .status { padding: 10px 16px; font-weight: 700; font-size: .95rem; border-top: 1px solid var(--line); }
  .status.ok { background: var(--good-bg); color: var(--good); }
  .status.edit { background: var(--clue-bg); color: var(--clue-ink); }
  .status.drop { background: var(--bad-bg); color: var(--bad); }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .btn { font: inherit; font-weight: 800; font-size: 1rem; border-radius: 12px; border: 2px solid transparent; padding: 14px 6px; cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ok { background: var(--good); color: var(--surface); }
  .btn.edit { background: var(--surface); color: var(--clue-ink); border-color: var(--arrow); }
  .btn.drop { background: var(--surface); color: var(--bad); border-color: var(--bad); }
  .btn.plain { background: var(--surface); color: var(--text); border-color: var(--line); font-weight: 700; }
  .nav { display: flex; justify-content: space-between; gap: 8px; }
  .nav .btn { flex: 1; padding: 10px 6px; font-size: .92rem; }
  .pos { text-align: center; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  form { display: flex; flex-direction: column; gap: 10px; }
  form label { display: flex; flex-direction: column; gap: 3px; font-size: .8rem; font-weight: 700; color: var(--muted); }
  input, textarea, select { font: inherit; font-size: 1rem; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
  textarea { resize: vertical; min-height: 2.6em; }
  .hintline { font-size: .8rem; font-weight: 400; }
  .hintline.bad { color: var(--bad); }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters button { font: inherit; font-size: .85rem; font-weight: 700; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--clue-ink); color: var(--surface); border-color: var(--clue-ink); }
  .item { display: grid; grid-template-columns: 1.3em 1fr auto; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; }
  .item .w { min-width: 0; overflow-wrap: anywhere; }
  .item .w small { color: var(--muted); }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); }
  .dot.ok { background: var(--good); border-color: var(--good); }
  .dot.edit { background: var(--arrow); border-color: var(--arrow); }
  .dot.drop { background: var(--muted); border-color: var(--muted); }
  .warn { color: var(--warn-ink); background: var(--warn-bg); font-size: .75rem; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
  .skip { display: grid; grid-template-columns: minmax(5em, auto) 1fr; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: .92rem; }
  .skip b { font-family: var(--serif); }
  .skip span { color: var(--muted); min-width: 0; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: .92rem; max-width: calc(100% - 32px); }
  @media (prefers-reduced-motion: no-preference) { .card { animation: in .18s ease-out; } @keyframes in { from { transform: translateY(6px); opacity: .6; } } }
</style>

<div class="wrap">
  <header>
    <h1>Kelime Köprüsü · kelime inceleme</h1>
    <p class="sub">Grup /*GRUPLAR*/ · Taslakları ben yazdım. İkinci kaynakla çevirisi uyuşanlar oyuna girdi; çıkardığın kelime oyundan da çıkar. Çevirisi farklı olanlar senin kararını bekliyor.</p>
  </header>

  <div class="progress" aria-live="polite">
    <div class="bar" id="bar"><i class="ok"></i><i class="ed"></i><i class="dr"></i></div>
    <div class="counts" id="counts"></div>
  </div>

  <div class="banner" id="dbBanner" hidden></div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-card" aria-selected="true">Sıradaki</button>
    <button role="tab" id="tab-list" aria-selected="false">Liste</button>
    <button role="tab" id="tab-skip" aria-selected="false">Elenenler</button>
  </div>

  <section id="view-card"></section>
  <section id="view-list" hidden></section>
  <section id="view-skip" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const DRAFTS = /*TASLAK*/[];
const SKIPPED = /*ELENEN*/[];
const POS_TR = { noun: 'isim', verb: 'fiil', adjective: 'sıfat', adverb: 'zarf' };
const LEVELS = ['A1', 'A2', 'B1', 'B2'];
const STATUS_TEXT = { ok: 'Onaylandı', edit: 'Düzeltilerek onaylandı', drop: 'Çıkarıldı' };

let db = null;
let decisions = {};      // id → {s, e?, t}
let index = 0;           // kart görünümündeki kelime
let editing = false;
let listFilter = 'todo';
let saving = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const wordRe = (w) => new RegExp('(?<![\\p{L}])(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![\\p{L}])', 'iu');
const highlight = (text, w) => esc(text).replace(wordRe(esc(w)), '<mark>$1</mark>');
const current = (d) => ({ ...d, ...(decisions[d.id]?.e ?? {}) });

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 1800);
}

function renderProgress() {
  const n = DRAFTS.length;
  const c = { ok: 0, edit: 0, drop: 0 };
  for (const d of DRAFTS) { const s = decisions[d.id]?.s; if (s) c[s]++; }
  const done = c.ok + c.edit + c.drop;
  const [a, b, x] = $('bar').children;
  a.style.width = (100 * c.ok / n) + '%'; b.style.width = (100 * c.edit / n) + '%'; x.style.width = (100 * c.drop / n) + '%';
  $('counts').innerHTML = `<span><b>${done}</b> / ${n} incelendi</span><span>${c.ok} onay</span><span>${c.edit} düzeltme</span><span>${c.drop} çıkarıldı</span>`;
}

function nextTodo(from) {
  for (let k = 0; k < DRAFTS.length; k++) {
    const i = (from + k) % DRAFTS.length;
    if (!decisions[DRAFTS[i].id]) return i;
  }
  return -1;
}

function renderCard() {
  const view = $('view-card');
  if (!DRAFTS.length) { view.innerHTML = '<p class="empty">Taslak yok.</p>'; return; }
  const raw = DRAFTS[index];
  const d = current(raw);
  const dec = decisions[d.id];
  const flags = d.flags.length && !dec ? `<ul class="flags">${d.flags.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : '';
  const canWrite = !!db && !saving;
  const head = `
    <div class="head">
      <div class="pair"><span class="en" lang="en">${esc(d.en)}</span><span class="arrow" aria-hidden="true">→</span><span class="tr">${esc(d.tr)}</span>${raw.ctx ? `<span class="ctx">(${esc(raw.ctx)})</span>` : ''}</div>
      ${raw.grammar ? `<div class="alts">${esc(raw.grammar)}</div>` : ''}
      ${d.alts ? `<div class="alts">Kabul edilen diğer cevaplar: ${esc(d.alts)}</div>` : ''}
      <div class="chips"><span class="chip">${d.level}</span><span class="chip">${POS_TR[d.pos] ?? d.pos}</span><span class="chip">${esc(d.topic)}</span>${d.oneWay ? '<span class="chip" title="Türkçesi 8 harften uzun">yalnız TR → EN</span>' : ''}${raw.game === 'crosscheck' && !dec ? '<span class="chip">oyunda · senin onayını bekliyor</span>' : ''}</div>
    </div>`;
  let body;
  if (editing) {
    body = `
    <form class="body" id="editForm">
      <label>Türkçe karşılık (tek kelime)<input id="f-tr" value="${esc(d.tr)}" autocomplete="off" autocapitalize="off"></label>
      <label>Diğer kabul edilen cevaplar (virgülle)<input id="f-alts" value="${esc(d.alts)}" autocomplete="off" autocapitalize="off"></label>
      <label>İngilizce örnek<textarea id="f-exEn" lang="en">${esc(d.exEn)}</textarea><span class="hintline" id="f-exEn-check"></span></label>
      <label>Türkçe örnek<textarea id="f-exTr">${esc(d.exTr)}</textarea></label>
      <label>Tanım (cevabı içermesin, en çok 90 karakter)<textarea id="f-hint">${esc(d.hint)}</textarea><span class="hintline" id="f-hint-check"></span></label>
      <label>Seviye<select id="f-level">${LEVELS.map((l) => `<option${l === d.level ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
      <div class="actions" style="grid-template-columns:1fr 2fr">
        <button type="button" class="btn plain" id="cancelEdit">Vazgeç</button>
        <button type="submit" class="btn ok" ${canWrite ? '' : 'disabled'}>Kaydet ve onayla</button>
      </div>
    </form>`;
  } else {
    body = `
    <div class="body">
      ${flags}
      ${d.cross ? `<div class="cross ${d.cross.same ? 'same' : 'diff'}">${d.cross.same ? 'İkinci kaynak da aynı çeviriyi veriyor.' : `İkinci kaynağın çevirisi farklı: <b>${esc(d.cross.tr)}</b>`}</div>` : ''}
      <div class="row"><span class="label">İngilizce örnek · cümle ipucu</span><p lang="en">${highlight(d.exEn, d.en)}</p></div>
      <div class="row"><span class="label">Türkçe örnek</span><p>${esc(d.exTr)}</p></div>
      <div class="row"><span class="label">Tanım ipucu</span><p>${esc(d.hint)}</p></div>
    </div>`;
  }
  const status = dec && !editing ? `<div class="status ${dec.s}">${STATUS_TEXT[dec.s]}</div>` : '';
  view.innerHTML = `
    <div class="card">${head}${body}${status}</div>
    ${editing ? '' : `
    <div class="actions" style="margin-top:12px">
      <button class="btn ok" id="aOk" ${canWrite ? '' : 'disabled'}>Doğru</button>
      <button class="btn edit" id="aEdit" ${canWrite ? '' : 'disabled'}>Düzelt</button>
      <button class="btn drop" id="aDrop" ${canWrite ? '' : 'disabled'}>Çıkar</button>
    </div>`}
    <div class="nav" style="margin-top:10px">
      <button class="btn plain" id="prev" ${index === 0 ? 'disabled' : ''}>← Önceki</button>
      <button class="btn plain" id="next" ${index === DRAFTS.length - 1 ? 'disabled' : ''}>Sonraki →</button>
    </div>
    <p class="pos">${index + 1} / ${DRAFTS.length}</p>`;

  $('prev').onclick = () => go(index - 1);
  $('next').onclick = () => go(index + 1);
  if (editing) {
    const check = () => {
      const ok = wordRe(d.en).test($('f-exEn').value);
      const c = $('f-exEn-check');
      c.textContent = ok ? `"${d.en}" cümlede geçiyor; cümle ipucu çıkar.` : `"${d.en}" cümlede aynen geçmiyor; bu kelime cümle ipucuyla gelmez.`;
      c.className = 'hintline' + (ok ? '' : ' bad');
      const h = $('f-hint').value; const hc = $('f-hint-check'); const tr = $('f-tr').value.trim();
      const bad = h.length > 90 || (tr && wordRe(tr).test(h));
      hc.textContent = `${h.length} karakter` + (tr && wordRe(tr).test(h) ? ` · tanımda "${tr}" geçiyor` : '');
      hc.className = 'hintline' + (bad ? ' bad' : '');
    };
    ['f-exEn', 'f-hint', 'f-tr'].forEach((id) => $(id).addEventListener('input', check));
    check();
    $('cancelEdit').onclick = () => { editing = false; renderCard(); };
    $('editForm').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const tr = $('f-tr').value.trim();
      if (!/^[\p{L}]+$/u.test(tr)) { toast('Türkçe karşılık tek kelime olmalı.'); return; }
      const e = {};
      const fields = { tr, alts: $('f-alts').value.trim(), exEn: $('f-exEn').value.trim(), exTr: $('f-exTr').value.trim(), hint: $('f-hint').value.trim(), level: $('f-level').value };
      for (const [k, v] of Object.entries(fields)) if (v !== raw[k]) e[k] = v;
      decide(raw.id, Object.keys(e).length ? 'edit' : 'ok', Object.keys(e).length ? e : undefined);
    });
  } else {
    $('aOk').onclick = () => decide(raw.id, 'ok');
    $('aDrop').onclick = () => decide(raw.id, 'drop');
    $('aEdit').onclick = () => { editing = true; renderCard(); };
  }
}

function go(i) {
  index = Math.max(0, Math.min(DRAFTS.length - 1, i));
  editing = false;
  renderCard();
  window.scrollTo({ top: 0 });
}

async function decide(id, s, e) {
  if (!db || saving) return;
  const body = { s, t: Date.now(), ...(e ? { e } : {}) };
  const prev = decisions[id];
  decisions = { ...decisions, [id]: body };
  saving = true;
  editing = false;
  renderProgress();
  try {
    await db.collection('kararlar').doc(id).set(body);
  } catch (err) {
    decisions = { ...decisions };
    if (prev) decisions[id] = prev; else delete decisions[id];
    saving = false;
    renderAll();
    toast(err?.code === 'invalid_argument' ? 'Bu sayfada karar kaydetme iznin yok.' : 'Kaydedilemedi, tekrar dene.');
    return;
  }
  saving = false;
  const n = nextTodo(index + 1);
  if (n >= 0) index = n;
  renderAll();
  window.scrollTo({ top: 0 });
  if (n < 0) toast('Bu gruptaki tüm kelimeler incelendi.');
}

function renderList() {
  const view = $('view-list');
  const counts = { todo: 0, diff: 0, flag: 0, edit: 0, drop: 0, all: DRAFTS.length };
  for (const d of DRAFTS) {
    const s = decisions[d.id]?.s;
    if (!s) counts.todo++;
    if (d.flags.length) counts.flag++;
    if (d.cross && !d.cross.same && !s) counts.diff++;
    if (s === 'edit') counts.edit++;
    if (s === 'drop') counts.drop++;
  }
  const f = { todo: 'Bekleyen', diff: 'Çeviri farklı', flag: 'Uyarılı', edit: 'Düzeltilen', drop: 'Çıkarılan', all: 'Tümü' };
  const pick = (d) => {
    const s = decisions[d.id]?.s;
    return listFilter === 'all' || (listFilter === 'todo' && !s) || (listFilter === 'flag' && d.flags.length) || (listFilter === 'diff' && d.cross && !d.cross.same && !s) || s === listFilter;
  };
  const rows = DRAFTS.map((d, i) => [d, i]).filter(([d]) => pick(d));
  view.innerHTML = `
    <div class="filters">${Object.keys(f).map((k) => `<button data-f="${k}" aria-pressed="${listFilter === k}">${f[k]} ${counts[k]}</button>`).join('')}</div>
    <div class="list">${rows.length ? rows.map(([raw, i]) => { const d = current(raw); const s = decisions[d.id]?.s ?? ''; return `
      <button class="item" data-i="${i}"><span class="dot ${s}" aria-label="${STATUS_TEXT[s] ?? 'Bekliyor'}"></span>
        <span class="w"><b lang="en">${esc(d.en)}</b> → ${esc(d.tr)} <small>${d.level}</small></span>
        ${d.flags.length ? '<span class="warn">uyarı</span>' : d.cross && !d.cross.same ? `<span class="warn">${esc(d.cross.tr)}</span>` : '<span></span>'}</button>`; }).join('') : '<p class="empty">Bu listede kelime yok.</p>'}</div>`;
  view.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { listFilter = b.dataset.f; renderList(); }));
  view.querySelectorAll('[data-i]').forEach((b) => (b.onclick = () => { index = Number(b.dataset.i); editing = false; showTab('card'); }));
}

function renderSkipped() {
  $('view-skip').innerHTML = `
    <p class="sub" style="margin:10px 0">Bu kelimeleri taslağa almadım: anlamı çok, Türkçesi tek kelime değil ya da oyundaki bir kelimeyle aynı Türkçe karşılığa düşüyor. Eklenmesini istediğin olursa bana yaz.</p>
    ${SKIPPED.map((s) => `<div class="skip"><b lang="en">${esc(s.en)}</b><span>${esc(s.reason)}</span></div>`).join('')}`;
}

function showTab(name) {
  for (const t of ['card', 'list', 'skip']) {
    $('tab-' + t).setAttribute('aria-selected', String(t === name));
    $('view-' + t).hidden = t !== name;
  }
  if (name === 'card') renderCard();
  if (name === 'list') renderList();
  window.scrollTo({ top: 0 });
}

function renderAll() {
  renderProgress();
  if (!$('view-card').hidden) renderCard();
  if (!$('view-list').hidden) renderList();
}

$('tab-card').onclick = () => showTab('card');
$('tab-list').onclick = () => showTab('list');
$('tab-skip').onclick = () => showTab('skip');

renderProgress();
renderCard();
renderSkipped();
$('dbBanner').hidden = false;
$('dbBanner').textContent = 'Kayıtlı kararlar yükleniyor…';

(async () => {
  db = await window.claude?.use?.('db').catch(() => null) ?? null;
  if (!db) {
    $('dbBanner').textContent = 'Kararlar bu görünümde kaydedilemiyor. Sayfayı claude.ai\'de, oturum açıkken aç.';
    renderAll();
    return;
  }
  let first = true;
  db.collection('kararlar').onSnapshot((snap) => {
    const next = {};
    for (const doc of snap.docs) next[doc.id] = doc.data();
    decisions = next;
    if (first) {
      first = false;
      $('dbBanner').hidden = true;
      const n = nextTodo(0);
      if (n >= 0) index = n;
    }
    if (!saving) renderAll(); else renderProgress();
  }, (err) => {
    $('dbBanner').hidden = false;
    $('dbBanner').textContent = 'Kararlar yüklenemedi. Sayfayı yeniden aç.';
  });
})();
</script>
